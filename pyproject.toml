[project]
name = "cottonil"
version = "0.1.0"
description = "Cottonil AI Business Assistant — HVIA Task 3 (data foundation, dashboards, assistant)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "streamlit>=1.37.0",
    "plotly>=5.22.0",
    "openai>=1.30.0",
    "statsmodels>=0.15.0",
]

[project.scripts]
build = "pipeline.build_db:main"
checks = "pipeline.checks:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Streamlit multipage requires the entrypoint to be named Home.py (capital H).
"app/Home.py" = ["N999"]

[tool.pytest.ini_options]
testpaths = ["tests"]
