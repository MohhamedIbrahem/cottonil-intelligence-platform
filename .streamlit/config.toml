# Streamlit theme (T034) - matches app/theme.py navy palette.
# Note: the canonical location is .streamlit/config.toml (the task list's
# "streamlit.config.toml" refers to this file).
[theme]
base = "dark"
primaryColor = "#2F80ED"
backgroundColor = "#0B1526"
secondaryBackgroundColor = "#13234C"
textColor = "#E8EEF7"
font = "sans serif"
headingFont = "sans serif"
baseFontSize = 15
baseRadius = "0.75rem"
buttonRadius = "0.65rem"
borderColor = "#DCE4EE"
showWidgetBorder = true
dataframeBorderColor = "#DCE4EE"
dataframeHeaderBackgroundColor = "#EDF2F7"
dataframeHeaderTextColor = "#17365D"
paddingTop = "1.1rem"
paddingBottom = "2.5rem"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FB"
textColor = "#172B4D"
borderColor = "#DCE4EE"
baseRadius = "0.75rem"
buttonRadius = "0.65rem"
showWidgetBorder = true

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 10
