# Cottonil Intelligence Platform - native Streamlit theme.
# The Python design system in app/theme.py owns cards, headers, charts and
# status semantics; this file owns the global light shell and widget defaults.

[theme]
base = "light"
primaryColor = "#2878D0"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172B4D"
linkColor = "#1F63B0"
font = "sans serif"
headingFont = "sans serif"
baseFontSize = 15
baseRadius = "0.75rem"
buttonRadius = "0.65rem"
borderColor = "#DCE4EE"
showWidgetBorder = true
dataframeBorderColor = "#DCE4EE"
dataframeHeaderBackgroundColor = "#EDF2F7"
dataframeHeaderTextColor = "#17365D"
paddingTop = "1.1rem"
paddingBottom = "2.5rem"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FB"
textColor = "#172B4D"
borderColor = "#DCE4EE"
baseRadius = "0.75rem"
buttonRadius = "0.65rem"
showWidgetBorder = true

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 10
